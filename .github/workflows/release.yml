name: Build & Release Putty-ES

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.3.1)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
      publish_pypi:
        description: "Publish to PyPI (Trusted Publisher)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: putty-es-linux-x64
          - os: windows-latest
            artifact_name: putty-es-windows-x64
          - os: macos-latest
            artifact_name: putty-es-macos-x64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e "." || true
          pip install pyinstaller customtkinter rich click pyyaml paramiko pydantic fabric

      - name: Build sdist + wheel
        run: python -m build

      - name: PyInstaller CLI
        shell: bash
        run: |
          pyinstaller --onefile --clean --noconfirm --name putty-es --paths src \
            --hidden-import=putty_es --hidden-import=putty_es.cli \
            --hidden-import=putty_es.modules.putty_fire \
            --collect-all customtkinter --collect-all rich \
            src/putty_es/cli.py || true

      - name: PyInstaller GUI
        shell: bash
        run: |
          pyinstaller --onefile --clean --noconfirm --windowed --name putty-es-gui --paths src \
            --collect-all customtkinter src/putty_es/gui/app.py || true

      - name: Pack artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          [ -f dist/putty-es ] && cp dist/putty-es release-assets/${{ matrix.artifact_name }}
          [ -f dist/putty-es.exe ] && cp dist/putty-es.exe release-assets/${{ matrix.artifact_name }}.exe
          [ -f dist/putty-es-gui ] && cp dist/putty-es-gui release-assets/${{ matrix.artifact_name }}-gui
          [ -f dist/putty-es-gui.exe ] && cp dist/putty-es-gui.exe release-assets/${{ matrix.artifact_name }}-gui.exe
          cp dist/*.whl release-assets/ 2>/dev/null || true
          cp dist/*.tar.gz release-assets/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/
          if-no-files-found: warn

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten (dedupe)
        shell: bash
        run: |
          mkdir -p final
          # Prefer unique basenames; large binaries last-write wins is ok
          find artifacts -type f | while read f; do
            bn=$(basename "$f")
            cp -f "$f" "final/$bn"
          done
          ls -lah final/

      - name: Tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "name=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=v0.3.1" >> $GITHUB_OUTPUT
          fi

      # Retry-friendly release: smaller batches reduce Unicorn/timeouts
      - name: Create / update release (metadata first)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Putty-ES ${{ steps.tag.outputs.name }}
          body: |
            ## Putty-ES ${{ steps.tag.outputs.name }}

            + **Putty-Fire** security layer (Protected by Putty-Fire)
            + ppiRuler, GUI, server modules

            ```bash
            pip install putty-es
            putty-es fire activate --host YOUR_SERVER
            ```
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Upload only packages first (small) – binaries in next step if needed
          files: |
            final/*.whl
            final/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            final/putty-es-*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true
